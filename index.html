<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b09">
<title>Gustavo &amp; Mariana · Cámara de la boda</title>
<meta name="description" content="La cámara descartable de la boda de Gustavo y Mariana. Sacá tus fotos de la noche.">
<style>
  html, body { margin:0; height:100%; background:#0d0b09; color:#f3ebdd; font-family:Georgia, 'Times New Roman', serif; }
  .carga { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center; padding:24px; box-sizing:border-box; }
  .mono { width:84px; height:84px; border-radius:50%; border:1px solid rgba(212,180,124,.7); display:flex; align-items:center; justify-content:center; font-size:30px; position:relative; animation:latido 1.6s ease-in-out infinite; }
  .mono::before { content:''; position:absolute; inset:5px; border-radius:50%; border:1px solid rgba(212,180,124,.3); }
  .mono i { color:#d4b47c; font-style:italic; margin:0 2px; }
  @keyframes latido { 50% { opacity:.45; transform:scale(.96); } }
  p { margin:0; color:#a1968a; font-size:15px; font-style:italic; }
  button { font:inherit; font-size:13px; letter-spacing:.24em; text-transform:uppercase; padding:15px 26px; border-radius:999px; border:0; cursor:pointer;
    background:linear-gradient(135deg,#f1dcae,#d4b47c 45%,#a9844b); color:#1b150d; }
</style>
</head>
<body>
<div class="carga" id="carga"><div class="mono">G<i>&amp;</i>M</div><p id="msg">Abriendo la cámara…</p></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbyNPeicEHx5qSdM4043suISweq12GPKlOBt4X5qjC-N6wh3WLDJzGWmemW6g-xbPmsO7g/exec';
  var BASE = location.origin + location.pathname.replace(/index\.html$/, '');
  var prm = {};
  new URLSearchParams(location.search).forEach(function (v, k) { prm[k] = v; });

  function error() {
    document.getElementById('msg').textContent = 'No se pudo abrir. Revisá la señal y probá de nuevo.';
    var b = document.createElement('button'); b.textContent = 'Reintentar'; b.onclick = function () { location.reload(); };
    document.getElementById('carga').appendChild(b);
  }
  function abrir(intento) {
    fetch(API, { method:'POST', body:JSON.stringify({ fn:'__render', args:[prm, BASE] }), redirect:'follow' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) throw new Error(d && d.error);
        var extra = '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
          + '<title>' + (d.titulo || '').replace(/</g, '') + '</title>'
          + '<script>window.__API=' + JSON.stringify(API) + ';<\/script>';
        var html = d.html.replace(/<head>/i, '<head>' + extra);
        document.open(); document.write(html); document.close();
      })
      .catch(function () { if (intento < 2) setTimeout(function () { abrir(intento + 1); }, 1500); else error(); });
  }
  abrir(0);
})();
</script>
</body>
</html>
